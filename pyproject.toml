[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lawrag"
version = "0.1.0"
description = "Graph RAG for Indian criminal law (IPC <-> BNS) with verification and justified abstention"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Academic project" }
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6",
  "httpx>=0.27",
  "numpy>=1.26",
  "typer>=0.12",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "langgraph>=0.2",
]

[project.optional-dependencies]
neo4j = ["neo4j>=5.20"]
embed = ["sentence-transformers>=3.0", "torch>=2.2"]
ingest = ["pymupdf>=1.24", "pdfplumber>=0.11"]
ui = ["streamlit>=1.35"]
eval = ["scipy>=1.11", "pandas>=2.0", "matplotlib>=3.8"]
ocr = ["pytesseract>=0.3.10", "opencv-python-headless>=4.9", "Pillow>=10"]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
lawrag = "lawrag.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lawrag = ["graph/*.cypher", "llm/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "slow: long-running or model-loading tests",
  "neo4j: needs a running Neo4j server",
  "ollama: needs a running Ollama server",
]
